  absent_reason: ''
- id: receptor_sign
  name: 'Synapse sign by postsynaptic receptor: Fenyves et al. 2020''s published prediction (NT+R) where it is + or -; else inhibitory where the postsynaptic class expresses more chloride-channel receptors
    (GluCl, ACC, UNC-49) for the presynaptic transmitter than cation-channel ones, in summed CeNGEN TPM (our guessed rule); the transmitter rule where it expresses neither'
  layer: synapse
  status: have
  toggle: receptor_sign
  neutral: off = the presynaptic transmitter rule
  default: 'off'
  source: Fenyves et al. 2020 PLoS Comput Biol 16:e1007974 S1 Data (CC BY); CeNGEN threshold 2 (Taylor et al. 2021), receptor families from WormBase
  notes: 1705 of 3709 pairs from Fenyves (+ or -), 1584 from our CeNGEN rule, 420 from the transmitter rule; Fenyves and our rule disagree on 182 of the 1705 (Fenyves used); 1039 pairs differ from the transmitter
    rule. Fenyves calls 436 pairs complex (both signs; our rule used)
  absent_reason: ''
- id: innexin_identity
  name: 'Gap junctions as innexin channels: conductance per EM contact = open channels x innexin unitary conductance (one shared value; no per-innexin measurement found); no junction where a partner expresses
    no innexin in CeNGEN. wiring=cook neuron-neuron gaps only. Rectification by innexin pair is not modelled: 923 of 1091 pairs could pair UNC-7 with UNC-9 by expression, so expression does not pick out
    the rectifying ones'
  layer: gap
  status: have
  toggle: innexin_identity
  neutral: off = gap_strength_per_pair for every pair
  default: 'off'
  source: CeNGEN threshold 2 (Taylor et al. 2021), 17 innexin genes; Bhattacharya et al. 2019 innexin atlas not yet used
  notes: ''
  absent_reason: ''
