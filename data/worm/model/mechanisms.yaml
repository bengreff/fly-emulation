  layer: cell
  status: have
  toggle: ''
  neutral: ''
  default: 'on'
  source: BAAIWorm b99ca5a (Zhao et al. 2024 Nat Comput Sci)
  notes: 'units bug as published: cai is in uM in the mod but NEURON''s Nernst reads it as mM against cao 2 mM, so eca sits near +41 mV at rest instead of about +130 mV (measured on backhouse: eca 41.2
    mV at cai 0.065). Fixed under literature_overrides (known value, literature wins): the outside Ca is entered as 2000 (uM, the same units as cai), cai starts at caeq 0.05 uM, celsius 20; eca then follows
    Nernst at about +130 mV at rest (derived). literature_overrides off = as published'
