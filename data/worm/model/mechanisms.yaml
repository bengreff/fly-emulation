- id: wiring
  name: 'Connectome: Cook et al. 2019, every pair (wiring=cook), or BAAIWorm''s construction as published (wiring=baaiworm: tanh-compressed counts placed on segments in contact)'
  layer: synapse
  status: have
  toggle: wiring
  neutral: baaiworm = as published (port302a)
  default: cook
  source: Cook et al. 2019 SI 5 (data/worm/structure); BAAIWorm b99ca5a (Zhao et al. 2024 Nat Comput Sci) config2detailed
  notes: 'Default cook since 5 Nov (port302c passed G1-G3 as pre-registered, docs/worm/BRAIN_PORT.md section 3; it saturated more than baaiworm on the old templates: 188 vs 141 neurons above -20 mV at 6
    s; see open_questions: saturation). BAAIWorm''s neuron-neuron counts (SI5-302.xlsx) equal Cook 2019 exactly (3709 chemical pairs, 20965 synapses; 1091 gap pairs; checked 5 Nov), but its construction
    places a site on only 2306 chemical and 599 gap pairs (single-synapse pairs round to 0 sites; other pairs have no neurite contact within 1 um). Its neuron-muscle table is its own (552 binary pairs,
    76 motor neurons; 337 are Cook edges, Cook has 956 pairs from 162 neurons) and it adds 175 muscle-to-neuron feedback synapses that are not anatomical (Cook has none; the sens_proprio layer covers proprioception).
    wiring=cook uses Cook for all of it: BAAIWorm''s sites where it placed any, else one site on the nearest segment pair'
  absent_reason: ''
