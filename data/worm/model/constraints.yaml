  statement: the one Ca pool volume <= the whole volume of the smallest neuron it is applied to
  strength: hard
  basis: physics
  source: cell volumes from the BAAIWorm hoc 3D points (scripts/worm/ranges/cell_sizes.csv, derived; area matches NEURON's to 0.01%)
  check: x <= limit
