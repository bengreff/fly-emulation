  kind: between
  lo_value: 12.7144
  hi_value: 856.1213
  x:
  - pump_vol_neuron_um3
  statement: pump_vol_neuron_um3 (a typical neuron's volume) between the smallest and largest neuron volume
  strength: hard
  basis: physics
  source: cell_sizes.csv (derived)
  check: lo <= x <= hi
  inclusive_lo: true
  applies_when: always
- id: passive_rin_neurons
  kind: passive_rin
  soma: pas_soma_gpas
  neurite: pas_neurite_gpas
  min_gohm: 0.2
  max_gohm: 5.0
  statement: each neuron's passive input resistance 1 / (g_pas,soma A_soma + g_pas,neurite A_neurite) >= 0.2 GOhm; its simulated input resistance at rest in [0.2, 5] GOhm
  strength: prior
  basis: measured_spread
  source: docs/worm/research/param_ranges.csv A3 (Goodman et al. 1998 J Neurosci 18:2729; Mellem et al. 2008 Neuron; inferred, low confidence); areas from cell_sizes.csv
  check: 'static: per neuron 1e8 / (gs As + gn An) / 1e9 >= min_gohm (g in S/cm2, A in um2); simulated: at rest, a -1 pA step for 300 ms, R_in = dV / dI in [min_gohm, max_gohm]'
  applies_when: always
