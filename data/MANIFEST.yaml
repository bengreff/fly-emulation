# Dataset and external-code manifest. Raw data lives outside git.
# Every entry: what it is, where it came from, exact version, license status, where it sits locally.

external_code:
  - name: Pugliese_cpg_2025
    url: https://github.com/smpuglie/Pugliese_cpg_2025
    commit: faee4b06869855ae0164cbf217fb6ec28ef3521b
    fetched: 2026-09-14
    local_path: external/Pugliese_cpg_2025
    license: UNVERIFIED (check LICENSE file before redistribution)
    contents_of_note: >
      JAX VNC simulation code plus bundled connectivity matrices (~409 MB):
      MANC full VNC W (20251006, 20260522 allSynapses), MANC T1 DN-to-MN (20250813),
      MANC T1L minicircuit (20241118), BANC T1 premotor (20251217, 20260217),
      FANC T1L BDN2-to-MN (20250107), iMAC T1 (20251110, 20260210). Dates in
      file names are extraction dates, not dataset release versions; map each
      to the underlying connectome version before use.
    role: reference calculation (ROADMAP first session step 3); comparison fixture

datasets:
  - name: MANC leg motor neurons
    source: neuPrint, dataset manc:v1.2.1, server neuprint.janelia.org
    access: token-based API query, no bulk download
    query: >
      Neuron nodes with class 'motor neuron' and subclass in (fl, ml, hl),
      returning bodyId, type, systematicType, subclass, target muscle, somaSide,
      somaNeuromere, status, synweight, pre, post.
    fetched: 2026-09-14
    local_path: data/derived/manc_leg_motor_neurons.csv
    rows: 396
    role: >
      Anatomical identity join for finding F2. All 144 front-leg motor neurons
      matched the bundled Pugliese T1 table on exact integer bodyId. The tibia
      flexor pool is 15 per side, matching the ~15 reported independently by
      Azevedo et al. 2020 (eLife 56754).
    caveats: >
      Muscle targets are annotations with their own confidence, not measurements.
      Counts depend on the inclusion policy: this dataset holds 23,665 Traced
      neurons alongside 75,643 nodes with no status, so any quoted neuron count
      must state which policy it used.

  - name: Synaptic scale sweep, recovered
    source: derived from this project's own runs
    local_path: data/derived/scale_sweep.csv
    role: finding F7; recovered from run logs after the sweep was stopped early
  - name: Phasic sensory sweep, recovered
    source: derived from this project's own runs on backhouse
    local_path: data/derived/phasic_sweep.csv
    role: finding F12

  - name: male-cns whole CNS graph
    source: neuPrint, dataset male-cns:v1.0, server neuprint.janelia.org
    access: token-based API query, chunked by bodyId quantile; no bulk download
    fetched: 2026-09-15
    local_path: data/cache/   # untracked
    files:
      - male_cns_neurons.parquet   # 176,422 rows, identity and predicted transmitter
      - male_cns_edges.parquet     # 25,862,574 edges, 125,024,863 synapses
      - male_cns_sensorimotor_roiinfo.parquet  # 7,651 rows, for leg assignment
    role: >
      Primary structural graph for the whole-organism model (finding F-DATA-2).
      Edge counts reproduce the independent figures in docs/PLAN.md exactly.
    caveats: >
      Per-neuron transmitter probabilities are NOT exposed in this dataset: the
      achProb/gabaProb/glutProb fields are all null, and only predictedNt plus
      a cell-type-level confidence are available. So the per-neuron transmitter
      resampling of finding F-SIGN-3 cannot be reproduced on male-cns without
      another source. Motor-neuron muscle target is in `type`, not `target`,
      which is null throughout. Sensory neurons carry no somaNeuromere, so leg
      identity comes from the dominant LegNp(T*) neuropil in roiInfo.

  - name: NeuroMechFly body
    source: flygym 2.1.0 bundled assets
    access: pip package
    role: body, 70 segments and 126 actuated joint degrees of freedom
    caveats: >
      Joint stiffness, damping and force limits are the body model's defaults,
      not measured fly mechanics, and the passive stiffness sets the scale of
      what counts as a motor command (finding F-TORQUE-1). Model units are
      mm/s/g, so force is uN and joint torque uN*mm; verified by test rather
      than assumed. Ground-contact sensors in this version are emitted with
      unprefixed object names and fail to compile.

literature_values_used:
  - quantity: slow tibia-flexor motor-neuron resting firing rate
    value: ~30 Hz
    source: Azevedo et al. 2020, eLife 56754, Figure 3D
    note: >
      A description of one neuron's resting rate, not a population mean with a
      dispersion. Used as an order-of-magnitude reference only.
  - quantity: force per spike, tibia flexor motor units
    value: slow <0.1 uN, intermediate ~1 uN, fast ~10 uN
    source: Azevedo et al. 2020, eLife 56754
    note: fast unit is roughly one fly body weight per spike
  - quantity: tibia flexor motor neuron count
    value: ~15
    source: Azevedo et al. 2020, eLife 56754, Discussion
    note: independently matched by the connectome annotation (finding F2)
  - quantity: femoral chordotonal organ transmitter
    value: excitatory, cholinergic, ~150 neurons
    source: Drosophila leg proprioception literature
    note: >
      Contradicts the EM classifier labels used in the model, which call 69% of
      chordotonal-organ neurons glutamatergic at mean confidence 0.69
      (finding F10).
  - quantity: glutamate sign in the Drosophila CNS
    value: inhibitory where GluCl is expressed postsynaptically, otherwise excitatory
    source: Liu and Wilson 2013, PNAS, and subsequent connectome-era commentary
    note: >
      A receptor property, not a transmitter property. The connectome does not
      contain receptor identity (finding F9).
