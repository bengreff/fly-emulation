  name: Epiney et al. 2025 eLife, type-2 neuroblast lineage snRNA-seq atlas (neurons), central complex
  version: GEO GSE294658 GSE294658_T2.atlas.neurons.rds (9985654022 bytes, on backhouse only); cluster identities from github dgepiney/2023_Doe_Drosophila_Central_Brain_RNAseq Data/sup tables, Supplemental Table 12 (1418 bytes) and Table 6 (17699679 bytes), fetched 2026-09-26
