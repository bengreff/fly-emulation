allen2020_vnc_atlas:
  name: Allen, Neville et al. 2020 eLife 9:e54074, adult VNC scRNA-seq atlas (26,768 high-quality cells reported; Drop-seq-style 10x, 111 neuronal + 12 non-neuronal clusters)
  version: GEO GSE141807 GSE141807_RAW.tar (70584320 bytes; 4 samples GSM4213596-99, female/male x 2 reps, genes x top-30000-barcode DGE matrices); eLife fig1-data1-v1.xlsx (459067 bytes, per-cluster Seurat FindAllMarkers output, clusters 0-119) and fig1-data2-v1.xlsx (17114 bytes, per-cluster cell number/neurotransmitter/"Predicted hemilineage"); fetched 2026-09-30
  license: GEO public data; eLife CC BY 4.0
  local: data/raw/allen2020_vnc/ (cache/ holds derived per-cell QC stats and extracted marker/receptor-gene rows, awk qc_and_extract.awk; GSM*.txt.gz decompress to ~750-850 MB each, not kept decompressed)
  sha256_prefix: RAW.tar bda31982a53a432b, fig1-data1 6cf8f8841383739c, fig1-data2 05053fb9a967e1ce
  basis: measured (single-cell RNA, raw UMI counts); GEO/eLife did NOT deposit the authors' per-cell cluster labels (checked GEO suppl, all eLife fig-data tables, and the authors' github aaron-allen/VNC_scRNAseq -- Seurat v2.3.4 R scripts only, no label checkpoint), so cluster/hemilineage assignment here is a marker-based label-transfer proxy (basis inferred) -- QC-passed cells (26,777 vs 26,768 published, using the same nGene/nUMI/mito cutoffs as the authors' R_preprocessing.R) are scored against each published cluster's top-12 markers and assigned to the highest-z cluster; validated against published per-cluster cell counts (Pearson r=0.72, Spearman r=0.68 over 120 clusters) but not a reproduction of the authors' CCA-integrated clustering
  use: data/derived/receptor_calls_allen2020_vnc.csv (21 Allen hemilineages x 33 receptor genes, fraction expressed and mean CP10K, 20/30/50% ON-call sensitivity) and data/derived/glutamate_sign_by_hemilineage_allen2020.csv (crosswalked to male-cns trumanHl, 24 rows) via scripts/receptors_allen2020_vnc.py. At the declared 30% threshold every one of the 21 hemilineages is "mixed" (GluClalpha and an iGluR both clear 30%) -- hemilineages pool many transcriptomically distinct cell types, so this does not resolve per-cell-type sign the way Davis 2020 (per-type TAPIN-seq) or Ozel 2021 (per-cluster) do; at 50% threshold 6 hemilineages call GluCl-dominated and 4 call iGluR-only

