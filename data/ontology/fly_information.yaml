# Everything about a fly's biology that could in principle be measured, and
# what the model does with it. The blank ledger (scripts/blank_ledger.py)
# counts slots from this file. A "slot" is one quantity at its grain.
#
# Fields
#   domain       organ system or level
#   quantity     what would be measured
#   grain        what one instance is
#   count        expression over the counts in blank_ledger.py (see COUNTS)
#   per          quantities per instance
#   measure_by   how the animal's value could be obtained
#   model        simulated | default | absent
#                  simulated: the model uses a value with evidence
#                  default:   the model runs on a guessed/placeholder value
#                  absent:    the mechanism is not in the model at all
#   basis        current label of the value(s): measured | derived |
#                inferred | guessed | unknown | absent | mixed
#   note         source, justification or gap
#
# Counts whose own basis is not measured say so in `count_basis`.

- {domain: connectome, quantity: neuron identity and cell type, grain: neuron, count: n_cells, per: 1, measure_by: EM reconstruction, model: simulated, basis: measured, note: male-cns v1.0 (Traced or typed)}
- {domain: connectome, quantity: chemical synapse count per connection, grain: edge, count: n_edges, per: 1, measure_by: EM synapse detection, model: simulated, basis: measured, note: ">=5 synapses per edge used; weaker edges present in the data"}
- {domain: connectome, quantity: synapse locations on the neuron (compartment), grain: synapse, count: n_syn, per: 1, measure_by: EM, model: absent, basis: measured, note: available in neuPrint, unused by point neurons}
- {domain: connectome, quantity: neuron morphology (skeleton, calibre, path lengths), grain: neuron, count: n_cells, per: 1, measure_by: EM, model: simulated, basis: measured, note: "session 6: one skeleton per type (11,751) reduced to soma-to-presynapse path length for delays; other uses (compartments) absent"}
- {domain: connectome, quantity: synapse ultrastructure (T-bar size, vesicle pool, PSD area), grain: synapse, count: n_syn, per: 3, measure_by: EM image analysis, model: absent, basis: unknown, note: not in the release; proxy for strength}
- {domain: connectome, quantity: electrical synapse partners (innexin gap junctions), grain: cell type, count: n_types, per: 1, measure_by: "EM at gap-junction resolution, innexin expression, dye coupling", model: default, basis: guessed, note: "guessed none, except identified GF pairs (electrical.py, optional); mechanism simulated"}
- {domain: connectome, quantity: soma position, grain: neuron, count: n_cells, per: 3, measure_by: EM, model: simulated, basis: measured, note: used for side assignment (F-VISION-2)}
- {domain: connectome, quantity: glial cells (type, count, contacts), grain: glial cell, count: n_glia, count_basis: inferred, per: 3, measure_by: EM, model: absent, basis: unknown, note: annotated in male-cns but not in the Neuron table used; count is an estimate}

- {domain: neuron, quantity: passive membrane (capacitance, input resistance, time constant), grain: cell type, count: n_types, per: 3, measure_by: whole-cell patch, model: default, basis: inferred, note: one value for all (Shiu 2024 borrowed)}
- {domain: neuron, quantity: resting potential, grain: cell type, count: n_types, per: 1, measure_by: patch, model: default, basis: inferred, note: -52 mV for all}
- {domain: neuron, quantity: spike threshold, reset, refractory period, grain: cell type, count: n_types, per: 3, measure_by: patch, model: default, basis: inferred, note: shared}
- {domain: neuron, quantity: spiking vs graded signalling, grain: cell type, count: n_types, per: 1, measure_by: patch, model: simulated, basis: mixed, note: "per-type table: photoreceptors graded (measured), L1-L3 and APL graded (inferred); all others spiking (guessed default)"}
- {domain: neuron, quantity: spike-frequency adaptation (increment, time constant), grain: cell type, count: n_types, per: 2, measure_by: patch, model: default, basis: guessed, note: mechanism present, set to zero (F-SFA-1)}
- {domain: neuron, quantity: ion-channel complement and densities, grain: cell type, count: n_types, per: 12, measure_by: "patch + pharmacology, scRNA-seq priors", model: absent, basis: unknown, note: "~12 major conductance classes (Nav, Kv1-4, Cav, KCa, HCN, leak)"}
- {domain: neuron, quantity: intrinsic bursting or pacemaking, grain: cell type, count: n_types, per: 1, measure_by: patch, model: absent, basis: unknown, note: e.g. clock neurons, CPG candidates}
- {domain: neuron, quantity: spontaneous firing rate (slow tibia flexor MN class), grain: cell type, count: 1, count_basis: derived, per: 1, measure_by: patch (Azevedo 2020), model: simulated, basis: derived, note: "30 Hz measured -> tonic drive derived through the m2 LIF; 60 cells classed by size rank (inferred)"}
- {domain: neuron, quantity: spontaneous firing rate, grain: cell type, count: "n_types - 1", per: 1, measure_by: extracellular/patch, model: default, basis: guessed, note: "per-type tonic drive simulated; 0 mV default"}
- {domain: neuron, quantity: axonal conduction delay (types with skeleton), grain: cell type, count: 11750, count_basis: derived, per: 1, measure_by: "morphology + velocity", model: simulated, basis: derived, note: "session 6: 0.5 ms + L/v, L from skeleton (derived), v 0.5 m/s inferred, GF 2.07 m/s measured"}
- {domain: neuron, quantity: axonal conduction delay (untyped cells), grain: cell type, count: "n_types - 11750", count_basis: derived, per: 1, measure_by: morphology, model: default, basis: inferred, note: "shared 1.8 ms default (Shiu)"}
- {domain: neuron, quantity: dendritic integration (compartment electrotonus), grain: cell type, count: n_types, per: 3, measure_by: "multi-site recording, morphology", model: absent, basis: unknown, note: single compartment}
- {domain: neuron, quantity: temperature dependence (Q10), grain: cell type, count: n_types, per: 1, measure_by: patch at temperatures, model: default, basis: inferred, note: "Q10 = 2 for all types, scales tau_m, tau_s, t_ref with world temperature"}

- {domain: synapse, quantity: transmitter identity, grain: presynaptic type, count: n_types, per: 1, measure_by: "immunostaining, EM classifier", model: simulated, basis: mixed, note: "predicted NT (derived from EM classifier); a few immuno-confirmed (measured)"}
- {domain: synapse, quantity: co-transmitters and neuropeptides released, grain: presynaptic type, count: n_types, per: 1, measure_by: "immuno, scRNA-seq", model: absent, basis: unknown, note: "~50 neuropeptide genes in Drosophila"}
- {domain: synapse, quantity: glutamate receptor sign per target (GluCl vs iGluR), grain: postsynaptic type, count: n_types, per: 1, measure_by: "scRNA-seq, pharmacology", model: default, basis: guessed, note: "session 6: per-target sign simulated; default = transmitter-level inhibitory (profile)"}
- {domain: synapse, quantity: GABA-A vs GABA-B share per target, grain: postsynaptic type, count: n_types, per: 1, measure_by: pharmacology, model: default, basis: guessed, note: "session 6: slow GABA-B current simulated (tau 150 ms guessed); share 0 default"}
- {domain: synapse, quantity: other postsynaptic receptor subtypes (nAChR subunits, mAChR), grain: postsynaptic type, count: n_types, per: 2, measure_by: "scRNA-seq, pharmacology", model: absent, basis: unknown, note: sets kinetics and slow cholinergic effects}
- {domain: synapse, quantity: synaptic strength (quantal size x release sites), grain: presynaptic type, count: n_types, per: 2, measure_by: paired recordings, model: default, basis: inferred, note: "per-presynaptic-type release gain simulated; all 1.0 x fitted 0.165 mV"}
- {domain: synapse, quantity: postsynaptic gain / input sensitivity, grain: postsynaptic type, count: n_types, per: 1, measure_by: paired recordings, model: default, basis: inferred, note: "per-postsynaptic-type input gain simulated; all 1.0 plus m1/m2 masks"}
- {domain: synapse, quantity: sign of each transmitter onto each target class, grain: transmitter x postsynaptic type, count: n_types, per: 1, measure_by: paired recordings + pharmacology, model: default, basis: mixed, note: ACh/GABA derived; glutamate inferred; monoamine/unclear guessed}
- {domain: synapse, quantity: kinetics (rise, decay), grain: synapse class, count: n_types, per: 2, measure_by: patch, model: default, basis: inferred, note: tau_s 5 ms for all}
- {domain: synapse, quantity: release probability and short-term plasticity, grain: presynaptic type, count: n_types, per: 3, measure_by: paired-pulse recordings, model: default, basis: guessed, note: "per-type mechanism simulated; U = 0 default (F-STD-1)"}
