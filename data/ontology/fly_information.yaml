- {domain: synapse, quantity: long-term plasticity rules (e.g. DAN-gated KC>MBON), grain: synapse class, count: n_plastic_classes, count_basis: inferred, per: 4, measure_by: explant plasticity experiments, model: default, basis: guessed, note: "session 6: KC>MBON LTD gated by DAN trace (compartment by DAN>MBON contacts) simulated, off by default; potentiation/recovery absent"}
- {domain: synapse, quantity: electrical synapse conductance and rectification, grain: electrical pair class, count: n_types, per: 2, measure_by: paired recordings, model: default, basis: guessed, note: "spike-coupling kick mechanism; GF pairs 20 mV (guessed), others none"}

- {domain: neuromodulation, quantity: modulator receptors per target type (DA, OA, 5-HT, TA receptors), grain: cell type, count: n_types, per: 4, measure_by: "scRNA-seq, pharmacology", model: default, basis: guessed, note: "per-type sensitivities to DA/OA/5-HT pools simulated; all 0 (inert) until filled"}
- {domain: neuromodulation, quantity: modulatory effects (gain, excitability, plasticity gating) and timescales, grain: modulatory type, count: n_mod_types, per: 4, measure_by: imaging + physiology, model: default, basis: guessed, note: "gain effect simulated via pools; excitability and plasticity gating absent"}
