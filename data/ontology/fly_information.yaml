- {domain: connectome, quantity: "neuron morphology (skeleton, calibre, path lengths)", grain: neuron, mech: N13, fidelity: type, count: n_cells, per: 1, measure_by: EM, model: simulated, basis: measured, note: "session 6: one skeleton per type (11,751) reduced to soma-to-presynapse path length for delays; other uses (compartments) absent"}
- {domain: connectome, quantity: "synapse ultrastructure (T-bar size, vesicle pool, PSD area)", grain: synapse, mech: N5, fidelity: none, count: n_syn, per: 3, measure_by: EM image analysis, model: absent, basis: unknown, note: not in the release; proxy for strength}
