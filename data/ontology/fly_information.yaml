# Everything about a fly's biology that could in principle be measured, and
# what the model does with it. The blank ledger (scripts/blank_ledger.py)
# counts slots from this file. A "slot" is one quantity at its grain.
#
# Fields
#   domain       organ system or level
#   quantity     what would be measured
#   grain        what one instance is
#   count        expression over the counts in blank_ledger.py (see COUNTS)
#   per          quantities per instance
#   measure_by   how the animal's value could be obtained
#   model        simulated | default | absent
#                  simulated: the model uses a value with evidence
#                  default:   the model runs on a guessed/placeholder value
#                  absent:    the mechanism is not in the model at all
#   basis        current label of the value(s): measured | derived |
#                inferred | guessed | unknown | absent | mixed
#   note         source, justification or gap
#   mech         mechanism id in data/model/mechanisms.yaml that carries the
#                quantity (X1 = structural data), or none (outside the inventory)
#   fidelity     the grain at which the model's value actually varies:
#                element (at this row's own grain) | type | class | global |
#                none (not simulated). Session 11 (ledger v3).
#
# Source level (ledger v3, most to least informative), computed per slot:
#   measured / derived   basis measured or derived ("unused" if fidelity none)
#   rule                 inferred, varying at the row's own grain (a biological
#                        rule or a fit per element: e.g. delays from volume)
#   prior                inferred, one value per class or for all (type means,
#                        borrowed or fitted class values)
#   mixed                part data, part guess (see note)
#   guessed              simulated on a placeholder
#   absent               not simulated
#
# Counts whose own basis is not measured say so in `count_basis`.

- {domain: connectome, quantity: neuron identity and cell type, grain: neuron, mech: X1, fidelity: element, count: n_cells, per: 1, measure_by: EM reconstruction, model: simulated, basis: measured, note: male-cns v1.0 (Traced or typed)}
- {domain: connectome, quantity: chemical synapse count per connection, grain: edge, mech: X1, fidelity: element, count: n_edges, per: 1, measure_by: EM synapse detection, model: simulated, basis: measured, note: ">=5 synapses per edge used; weaker edges present in the data"}
