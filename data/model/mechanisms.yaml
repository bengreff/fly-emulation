# The complete-fly mechanism inventory (docs/CONSTRUCTION.md, "the template").
# One entry per mechanism. Every unknown in parameters.csv names exactly one
# mechanism_id from this file (principle 4); tests/test_model_data.py checks it.
#
# Fields
#   id        B* body/periphery, S* internal state/organs, N* nervous system
#   name      mechanism and required level (docs/research/FIDELITY.md)
#   tier      A posture/walking/senses; B flight/takeoff/landing;
#             C grooming/feeding/state/learning (FIDELITY.md table)
#   status    have | partial | absent (built and on at its prior = have)
#   switch    registry keys (entity|property) that turn the mechanism on or
#             select its mode; [] = structural (always on, no switch)
#   neutral   the setting at which it reproduces the model without it
#   test      tests that verify it (neutral-equivalence and what it claims);
#             [] = not yet tested
#   absent_reason  required for tier C absent (ledger acceptance rule)
#   notes     evidence and gaps (labels as recorded; never upgraded here)
#
# Status as of session 9 start (27 Sep 2026) copied from CONSTRUCTION.md.

