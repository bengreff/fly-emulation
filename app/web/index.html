<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Workbench</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
:root {
  --bg: #f3f1ec; --panel: #fbfaf7; --fg: #1d1f22; --dim: #7d7a73; --line: #dedad2;
  --accent: #e0501a; --measured: #2a7f62; --inferred: #2f6fd0; --guessed: #b07a00; --completed: #9040c0; --unknown: #8a8780;
  --sans: "Archivo", "Helvetica Neue", Helvetica, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #0f1113; --panel: #15171a; --fg: #e4e2dc; --dim: #8a8d92; --line: #2a2d31;
  --accent: #ffb020; --measured: #4fd1a5; --inferred: #6aa8ff; --guessed: #e0b040; --completed: #c58af0; --unknown: #8a8d92;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); }
header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 0.02em; }
header .meta { color: var(--dim); font-family: var(--mono); font-size: 12px; }
header .grow { flex: 1; }
select, button, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
button { cursor: pointer; }
button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.badge { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); }
.badge.warn { border-color: var(--guessed); color: var(--guessed); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(300px, 52vh) minmax(0, 1fr); height: calc(100% - 92px); }
#views { display: grid; grid-template-columns: 2fr 3fr; gap: 1px; background: var(--line); min-height: 0; }
.pane { position: relative; background: var(--panel); min-width: 0; min-height: 0; }
.pane canvas { width: 100%; height: 100%; display: block; }
.pane .title { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--dim); pointer-events: none; }
.pane .title b { color: var(--fg); }
.pane .head { position: absolute; left: 10px; top: 8px; right: 10px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.pane .head .title, .pane .head .toolbar { position: static; }
.pane .head .toolbar, .pane .head .count { pointer-events: auto; }
.count { font-size: 11px; color: var(--dim); }
.count b { color: var(--fg); font-weight: 600; }
.count .warn { color: var(--guessed); }
.count abbr { text-decoration: underline dotted; cursor: help; }
.toolbar { position: absolute; left: 10px; top: 28px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; max-width: calc(100% - 20px); }
.toolbar label { color: var(--dim); display: flex; gap: 3px; align-items: center; }
#bodytools { position: absolute; left: 10px; top: 28px; font-size: 12px; color: var(--dim); }
#legend { position: absolute; right: 8px; top: 64px; font-size: 11px; background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 6px 8px; border-radius: 4px; max-height: calc(100% - 80px); overflow: auto; }
.lg { cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.lg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.lg span { color: var(--dim); margin-left: auto; padding-left: 8px; font-family: var(--mono); }
.lg.off { opacity: 0.35; text-decoration: line-through; }
#glabels span { position: absolute; font: 10px var(--mono); color: var(--dim); pointer-events: none; white-space: nowrap; }
#tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font: 11px var(--mono); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
aside { grid-row: 1 / 3; grid-column: 2; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px 14px; }
#tabs { display: flex; gap: 6px; margin-bottom: 8px; }
#search { width: 100%; margin-bottom: 4px; }
#results .hit { cursor: pointer; padding: 2px 4px; font-family: var(--mono); font-size: 12px; }
#results .hit:hover { background: var(--bg); }
#results .hit span { color: var(--dim); }
aside h2 { font-size: 16px; margin: 6px 0 2px; font-family: var(--mono); }
aside h3 { font-size: 12px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 600; }
aside .sub, .dim { color: var(--dim); font-size: 12px; }
aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
aside td { padding: 2px 4px 2px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
aside td:first-child { color: var(--dim); white-space: nowrap; }
aside tr.link { cursor: pointer; }
aside tr.link:hover td { background: var(--bg); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mono { font-family: var(--mono); word-break: break-all; }
.chip { display: inline-block; font: 10px var(--mono); padding: 0 5px; border-radius: 8px; border: 1px solid currentColor; margin-left: 3px; white-space: nowrap; vertical-align: 1px; }
.chip.measured { color: var(--measured); } .chip.inferred { color: var(--inferred); }
.chip.guessed { color: var(--guessed); } .chip.completed { color: var(--completed); } .chip.unknown { color: var(--unknown); }
.caveats { padding-left: 16px; margin: 4px 0; } .caveats li { margin-bottom: 6px; font-size: 12px; }
.empty { color: var(--dim); padding: 20px 0; }
#traces-wrap { grid-column: 1; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); min-height: 0; }
#traces { width: 100%; display: block; cursor: crosshair; }
footer { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-top: 1px solid var(--line); background: var(--panel); height: 40px; }
footer #scrub { flex: 1; padding: 0; }
#time { font-family: var(--mono); font-size: 12px; min-width: 150px; }
#status { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.verdict { font: 600 12px var(--mono); padding: 1px 7px; border-radius: 3px; color: #fff; }
.verdict.pass { background: var(--measured); } .verdict.fail { background: #c0392b; } .verdict.none { background: var(--unknown); }
.warnline { color: var(--guessed); font-size: 12px; }
#tab-session textarea { width: 100%; box-sizing: border-box; font: 11px var(--mono); background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
#tab-session .row, #tab-session .stimform { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 5px 0; font-size: 12px; }
#tab-session .stimform input { width: 70px; } #tab-session #ses-target { width: 150px; }
#tab-session .ok { color: var(--measured); font-size: 12px; }
#tab-session pre { font-size: 10px; white-space: pre-wrap; }
aside td.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
aside td.num.wrap { white-space: normal; }
table.models td, table.diff td { font-size: 11px; }
table.diff td:first-child { white-space: normal; overflow-wrap: anywhere; }
main.wide { grid-template-columns: minmax(0, 1fr) 600px; }
table.coltable td { font-size: 11px; }
table.coltable tr.hd td { color: var(--dim); font-weight: 600; }
table.coltable tr.grp td { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 6px; }
table.coltable tr.on td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
table.coltable td.mode.graded { color: var(--inferred); }
#eye-traces { width: 100%; display: block; cursor: crosshair; margin: 4px 0; }
.stimkey { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #0090c0; background: none !important; vertical-align: -1px; }
[data-theme="dark"] .stimkey { border-color: #40d0ff; }
</style>
</head>
<body>
<header>
  <h1>Fly Workbench</h1>
  <select id="run" title="recording"></select>
  <span class="meta">scan <span id="scan">…</span></span>
  <span id="badge" class="badge"></span>
  <span class="grow"></span>
  <span id="status"></span>
  <button id="theme" title="light / dark">theme</button>
</header>
<main>
  <section id="views">
    <div class="pane">
      <canvas id="body"></canvas>
      <div class="title"><b>Body</b> · flybody (MuJoCo) · <span id="bodyinfo"></span></div>
      <div id="bodytools"><label><input type="checkbox" id="follow" checked> follow</label> <span class="dim">feet tint = contact load</span></div>
    </div>
    <div class="pane">
      <canvas id="brain"></canvas>
      <div class="head">
      <div class="title"><b>Brain map</b> · <span id="brain-scan"></span> · spikes glow (display decay 30 ms)</div>
      <div id="brain-count" class="count"></div>
      <div class="toolbar">
        <span id="layout"><button data-v="anatomy" class="on">anatomy</button> <button data-v="flow">flow</button> <button data-v="groups">groups</button></span>
        <label>colour <select id="colour">
          <option value="superclass">superclass</option><option value="nt">transmitter</option>
          <option value="basis">position basis</option><option value="side">side</option>
          <option value="model">in model</option><option value="layer">flow layer</option>
          <option value="delta" disabled>rate vs control</option>
        </select></label>
        <label><input type="checkbox" id="activity" checked> activity</label>
        <label><input type="checkbox" id="inmodel"> in model only</label>
        <label><input type="checkbox" id="measured"> measured positions only</label>
        <button id="reframe" title="fit the view">fit</button>
      </div>
      </div>
      <div id="glabels"></div>
      <div id="legend"></div>
      <div id="tip" hidden></div>
    </div>
  </section>
  <section id="traces-wrap"><canvas id="traces"></canvas></section>
  <aside>
    <div id="tabs"><button data-tab="neuron" class="on">Neuron</button><button data-tab="run">Run</button><button data-tab="compare">Compare</button><button data-tab="session">Session</button><button data-tab="eye">Eye</button></div>
    <div id="tab-neuron" class="tab">
      <input id="search" placeholder="type name (e.g. MN9, DNa02) or bodyId" autocomplete="off">
      <div id="results"></div>
      <div id="inspector"></div>
    </div>
    <div id="tab-run" class="tab" hidden></div>
    <div id="tab-compare" class="tab" hidden></div>
    <div id="tab-session" class="tab" hidden></div>
    <div id="tab-eye" class="tab" hidden></div>
  </aside>
</main>
<footer>
  <button id="play">play</button>
  <span id="time"></span>
  <input id="scrub" type="range" min="0" max="1000" step="0.1" value="0">
  <label class="dim">speed <select id="speed">
    <option value="0.05">0.05x</option><option value="0.1">0.1x</option><option value="0.25" selected>0.25x</option>
    <option value="0.5">0.5x</option><option value="1">1x (real time)</option>
  </select></label>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
