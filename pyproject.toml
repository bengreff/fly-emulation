[project]
name = "fly-emulation"
version = "0.0.1"
description = "Biologically constrained Drosophila brain-body simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "h5py>=3.11",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "jax>=0.4.35",
    "pytest>=8",
    "pyyaml>=6",
    "requests>=2.32",
    "diffrax>=0.7,<0.8",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<2.4",
    "sparse>=0.17,<0.19",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.1",
    "natsort>=8.4.0",
    "tqdm>=4.70.1",
    "psutil>=7.2.2",
    "jupyter>=1.1.1",
    "neuprint-python>=0.6.3",
    "mujoco>=3.9.0",
    "flygym>=2.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
