  - {re: "^(ma_release_nM_per_s|pep_release_nM_per_s|nlp40_release_nM_per_s|int_h_release_nM_per_s)$", hard_row_unit: [0, 1.0e6], basis: guessed_physical, why: "a release rate as a concentration rise, >= 0", source: "definition"}
  - {re: "^ma_extrasyn_channels$", cls: channels_per_cell}
  - {re: "^cc_clearance", cls: count_nonneg}
  - {re: "^gpcr_", cls: gain_nonneg}
  - {re: "^touch_n_channels$|^harsh_n_channels$", cls: channels_per_cell}
  - {re: "^(release|nca|irk|egl19)_g[qsi]_gain$", cls: gain_nonneg}
  - {re: ".", unit: ["1 per unit G"], cls: gain_nonneg}
  - {re: ".", unit: ["J/(mol K)"], cls: gas_constant}

# reasons for biological ranges wider than one decade (span_reason); first match wins. Rows wider than one decade
# with no reason here or from a measured spread are listed in CATALOG.md "Ranges" as wide without a reason.
span_reasons:
  - {re: "^rec_.*_tau_rise_ms$", why: "ligand-gated rise times measured 0.1-2 ms across nicotinic, GABA-A and glutamate receptors under fast application; worm recordings are clamp-limited (PORT_SOURCES N1)"}
  - {re: "^rec_.*_tau_des_ms$", why: "desensitisation time constants across Cys-loop receptors span 0.1 s to tens of s (Hernando et al. 2023 Biophys Rev); the worm receptors are described qualitatively only"}
  - {re: "^rec_.*_tau_off_ms$", why: "deactivation across receptor families: a few ms (AMPA, nicotinic) to hundreds of ms (slow GABA, LGC channels)"}
  - {re: "^rec_.*_ec50_uM$", why: "agonist EC50s across a receptor family span decades in heterologous recordings (Hernando et al. 2023; Hansen et al. 2021)"}
  - {re: "^(rec_.*_gamma_pS|chnoise_.*_pS)$", why: "unitary conductances across the channel family span 5-90 pS [HB 2]"}
  - {re: "^rec_tmax_", why: "cleft peak concentration: 0.1-5 mM for fast transmitters at vertebrate synapses, lower for graded and monoamine release; not measured in the worm"}
  - {re: "^rec_.*_ss_frac$", why: "steady-state fraction after desensitisation: not retrieved; 1-50% across receptors"}
  - {re: "^rec_mg_mM$", why: "external Mg2+: not measured in worm body fluid; salines hold 1-5 mM, NGM 1 mM"}
  - {re: "^(stp_|hab_beta)", why: "short-term plasticity constants: tens to hundreds of ms in Dittman et al. 2000; worm NMJ trains (Liu et al. 2009) constrain the ACh grain only"}
  - {re: "^(gq|gi|gs)_tau_ms$|^sens_trpv_tauG_ms$|^obs_opto_tau_o(n|ff)_ms$", why: "G-protein and opsin cascades: 100 ms to several s (PORT_SOURCES N4)"}
  - {re: "(_g_nS|_g_b_nS|_g_dva_nS|_g_smd_nS|_gna_.*_nS|_g_leak_nS|_gleak_nS|_nS_per_contact|^sens_(cng|trpv)_g_nS)$", why: "a whole-cell conductance with no worm recording: bounded jointly by the cell's input resistance (0.2-5 GOhm, param_ranges A3; constraints.yaml input_resistance)"}
  - {re: "^(pas_.*_gpas|mpas_gpas|egg_vm_egl19_g_S_cm2)$", why: "a membrane conductance density: bounded jointly by the measured input resistance per class (constraints.yaml input_resistance); per-cell ranges by size in step 3"}
  - {re: "_Ra$", why: "cytoplasm resistivity measured 30-400 ohm cm across neurons [HB 4]"}
  - {re: "(_rm_kohm_cm2)$", why: "specific membrane resistance across cell types: 1-50 kOhm cm2 [HB 4]"}
  - {re: "(food_od0|_K_OD|_food_k_od)$", why: "bacterial density spans 0.01-5 OD600 across feeding assays"}
  - {re: "^(touch|harsh)_f0_uN$", why: "behavioural thresholds: gentle touch about 1 uN, harsh touch above about 100 uN (Petzold et al. 2013)"}
  - {re: "(_tau_adapt_s|^homeo_tau_s|_tau_g_h|^learn_.*_tau_(min|h)|^slow_set_s|^met_pump_tau_s|^exc_volume_tau_s|^egg_uv1_tyr_tau_s|^glia_kir_tau_s)$", why: "adaptation, homeostatic and learning time constants are measured only as behavioural half-times, seconds to hours across paradigms"}
  - {re: "(_area_.*_um2|_area_um2|^pc_cross_section_um2|_volume_um3)$", why: "cell and compartment sizes differ across the cells this row covers (WormAtlas)"}
  - {re: "^(touch|harsh)_n_channels$|^gap_open_channels_per_em$", why: "channel counts per cell or junction: not counted in the worm; the span covers one channel per punctum (Sanzeni et al. 2019) to dense packing"}
  - {re: "^(sens_|touch_|harsh_|nose_|tap_|proprio_|mca_|mact_|bwm_act_|ent_act_|egg_act_)", why: "a sensory or excitation-contraction constant with no direct worm measurement; the span covers the stimulus or Ca range the behaviour responds to"}
  - {re: "^(syn_weight_|gap_weight|gap_strength)", why: "a synaptic or gap weight per EM contact: unitary worm values are not measured; bounded jointly by the postsynaptic input resistance"}
  - {re: "^(pump_|met_|osmo_|cc_|int_|aex2_|egg_|glia_|other_|endo_|ph_|pbo5_|exc_|phar_|sleep_|scene_|assoc_|pc_|gcamp_|obs_|usu_|bwm_|mw_|ion_)", why: "an organ, sensor or environment constant with no direct worm measurement; the span is the guessed range in its source and is a data target"}
  - {re: "^pep_ec50_", why: "neuropeptide-GPCR EC50s measured across the family span pM to uM (Beets et al. 2023, 461 pairs); a pair without its own measurement keeps the family span"}
  - {re: "^ma_ec50_", why: "monoamine GPCR EC50s measured across receptors span ~10 nM to ~100 uM (receptor-by-receptor heterologous assays)"}
  - {re: "^dens_", why: "a per-cell conductance density: BAAIWorm fitted each cell's density to one recording or none; the range keeps zero (channel absent) and the span over cells of the same type"}
  - {re: "^(assoc_.*_tau_min|hab_tau_s|homeo_.*_tau|slow_.*_tau_h|.*_tau_h)$", why: "learning, forgetting and homeostatic time constants are measured only as behavioural half-times spanning minutes to hours across paradigms"}
  - {re: "^usu_init_", why: "Usuyama's initial state of the AWC cascade: published values x/10 to 10x, the model's own steady state is fitted, not measured"}
  - {re: "^usu_r", why: "a rate constant of Usuyama's fitted AWC cascade: no single-step measurement exists; the factor 10 band is the fit's identifiability"}
  - {re: "(_ref_uM|_ref_mM|_K_uM|_K_mM|_c0_uM|_c0_mM|repel_c0)$", why: "sensory dose-response midpoints span the tested concentration series (dilutions over decades in the chemotaxis literature)"}
  - {re: "^(ma_|pep_|dcv_|nlp40_)", why: "extrasynaptic release, store and clearance numbers are not measured for any worm neuron; the span covers mammalian synaptic and volume-transmission measurements"}
