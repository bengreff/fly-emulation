# Hard bounds for every worm ledger row (wranges, 7 Nov 2026). Read by scripts/worm/ranges/hard.py, which
# build_ledger.py calls at the end of the build. Hand-written; the build writes the resolved per-row result to
# data/worm/model/parameters.csv (hard_min, hard_max, hard_class, hard_basis, hard_source, fit_role) and the joint
# constraints to data/worm/model/constraints.yaml.
#
# HARD bounds are what physics and chemistry forbid for any animal cell, whatever the species. The BIOLOGICAL range
# (bio_min, bio_max, with its prior) is what any C. elegans, or the nearest measured system, has been measured to do;
# it must lie inside the hard bounds, and it is the box a fitter searches. hard_basis says whether a hard bound is
# physics (a conservation law, a structure size, Nernst over the ion windows below, a definition) or
# guessed_physical (a limit set by judgement where physics gives no sharp edge; the reason is written down).
#
# Units: class bounds are in the class's canonical unit (hard.py UNITS converts to the row's unit). A rule or row
# entry with `hard_row_unit` gives the bounds directly in the row's own unit.
# Sources marked [HB n] are items of docs/worm/research/HARD_BOUNDS_LIT.md (free sources, opened 7 Nov).

env:
  temperature_C: [0, 40]       # liquid water to the top of any C. elegans survival (dies within hours above ~30 C) [HB 12]
  # ion windows, mM, any animal cell with a negative resting potential and an extracellular fluid of ordinary
  # salinity (fresh-water to marine); guessed_physical, wider than every nematode value in [HB 9]
  ions:
    K:  {z: 1, inside: [80, 200], outside: [1, 30]}
    Na: {z: 1, inside: [2, 50], outside: [50, 250]}
    Ca: {z: 2, inside: [0.00001, 0.01], outside: [0.1, 20]}     # free Ca inside 10 nM to 10 uM (whole cell)
    Cl: {z: -1, inside: [2, 100], outside: [20, 250]}

classes:
  # ---- electrical -------------------------------------------------------------------------------------------------
  reversal_K:    {nernst: [K], why: "Nernst E_K over the K windows and 0-40 C"}
  reversal_Na:   {nernst: [Na], why: "Nernst E_Na over the Na windows and 0-40 C"}
  reversal_Ca:   {nernst: [Ca], why: "Nernst E_Ca over the Ca windows and 0-40 C"}
  reversal_Cl:   {nernst: [Cl], why: "Nernst E_Cl over the Cl windows and 0-40 C"}
  reversal_cation: {nernst: [K, Na, Ca], why: "a cation-permeable channel reverses between the most negative and the most positive Nernst potential of its ions (GHK)"}
  reversal_leak: {nernst: [K, Na], why: "a resting leak (K, Na, Cl mix) reverses between E_K and E_Na (GHK)"}
  reversal_inhibitory: {nernst: [K, Cl], why: "an inhibitory channel passes Cl or K: between their extreme Nernst potentials"}
  membrane_potential: {nernst: [K, Na, Ca, Cl], why: "a membrane potential set by ion channels lies between the extreme Nernst potentials"}
  rt_over_f: {dim: voltage, hard: [23.54, 26.98], basis: physics, why: "RT/F = k_B T / e at 0-40 C", source: "CODATA k_B/e = 8.617333e-5 V/K"}
  voltage_midpoint: {dim: voltage, hard: [-200, 200], basis: guessed_physical,
    why: "a gate or release midpoint beyond +-200 mV is past membrane breakdown (electroporation at a few hundred mV) and the gate would be fixed over the whole Nernst window; BK at nominal zero Ca, the most extreme measured, sits near +150 to +200 mV",
    source: "[HB 6]; Weaver and Chizmadzhev 1996 (electroporation)"}
  voltage_slope: {dim: voltage, hard: [1.5, 200], sign: template, basis: physics,
    why: "Boltzmann slope k = RT/(zF): z at most about 16 e (Shaker's total gating charge 12-14 e) gives |k| >= 1.5 mV; above 200 mV (z < 0.13 e) the gate is voltage-independent over the window (guessed edge)",
    source: "[HB 6]; Aggarwal and MacKinnon 1996 Neuron (Shaker 13 e)"}
  voltage_sensitivity: {dim: inv_voltage, hard: [-0.7, 0.7], basis: physics,
    why: "an exponential rate factor exp(w V) has |w| = z F/RT <= 16/23.5 per mV", source: "as voltage_slope"}
  conductance_density: {dim: cond_density, packing: true, basis: physics,
    why: "0 to (densest channel packing) x (the family's largest unitary conductance)", source: "[HB 1], [HB 2]"}
  leak_density: {dim: cond_density, hard: [1.0e-8, 0.6], basis: physics,
    why: "not below a pure lipid bilayer (specific resistance ~1e8 ohm cm2); at most the densest packing (2e4 per um2) of 300 pS channels, 600 S/cm2, capped here at 0.6 S/cm2, the node-of-Ranvier density, because a resting leak that dense would hold no potential (guessed edge)",
    source: "[HB 1], [HB 4]"}
  specific_resistance: {dim: spec_resistance, hard: [0.0017, 1.0e5], basis: physics, why: "inverse of leak_density's physical edges", source: "[HB 4]"}
  unitary_conductance: {dim: conductance, hard: [0.0001, 0.3], basis: physics,
    why: "0.1 pS (smallest resolved single channels) to 300 pS (BK, the largest ion-selective channel)", source: "[HB 2]"}
  gap_unitary: {dim: conductance, hard: [0.001, 0.5], basis: physics,
    why: "connexin and innexin channels, 1 to about 500 pS", source: "[HB 2]"}
  conductance_cell: {dim: conductance, hard: [0, 10000], basis: guessed_physical,
    why: "a whole-cell or per-contact conductance: at most the largest worm cell area (~2e3 um2 for a body-wall muscle, more for hyp7) times a node-of-Ranvier density (0.5 S/cm2): 1e4 nS", source: "[HB 1]"}
  capacitance_specific: {dim: cap_specific, hard: [0.3, 3.0], basis: physics,
    why: "a lipid bilayer is 0.3-1 uF/cm2 by thickness and dielectric constant; biological membranes measure 0.5-2; above 3 needs membrane folds the morphology would have to omit",
    source: "[HB 3]"}
  capacitance_cell: {dim: capacitance, hard: [0.05, 5000], basis: physics,
    why: "specific capacitance limits times the smallest (~10 um2) and largest (~1.6e5 um2, hyp7) worm cell areas", source: "[HB 3]"}
  axial_resistivity: {dim: resistivity, hard: [20, 1000], basis: guessed_physical,
    why: "cytoplasm is at least as resistive as the saline it is made of (~50 ohm cm at 150 mM, 20 C; 20 allows 400 mM); above 1000 ohm cm no measured cytoplasm",
    source: "[HB 4]"}
  current_gain: {dim: current, hard: [-1000, 1000], basis: guessed_physical,
    why: "a lumped current into one cell: 1 nA drives a 1 GOhm worm neuron past every reversal potential", source: "param_ranges A3 (input resistance 0.2-5 GOhm)"}
  current_nonneg: {dim: current, hard: [0, 1000], basis: guessed_physical, why: "as current_gain, sign fixed by the mechanism", source: "param_ranges A3"}
  # ---- time ------------------------------------------------------------------------------------------------------
  tau_gate: {dim: time, hard: [0.01, 1.0e7], basis: physics,
    why: "a channel gate: not faster than ~10 us (fastest measured gating) and not slower than ~3 h (no slow inactivation measured slower)",
    source: "[HB 6]"}
  tau_coefficient: {dim: time, hard: [1.0e-6, 1.0e7], sign: template, basis: guessed_physical,
    why: "a coefficient inside a tau(V) formula: no physical meaning alone; magnitude at most the slowest gate. The binding limit is the joint constraint gate_window (tau(V) inside tau_gate over the voltage window)",
    source: "constraints.yaml gate_window"}
  tau_binding: {dim: time, hard: [0.01, 5.2e9], basis: physics,
    why: "a receptor or sensor rise: diffusion-limited binding (1e9 /M/s) at a 1 mM peak is 1 us per binding; 10 us is the fastest measured ligand-gated rise; at most the lifespan",
    source: "[HB 6]"}
  tau_process: {dim: time, hard: [0.001, 5.2e9], basis: physics,
    why: "any process inside a worm: above 1 us, below 60 days (adult lifespan 2-3 weeks; 60 d covers the longest-lived strains)",
    source: "[HB 6], [HB 12]"}
  duration: {dim: time, hard: [0, 5.2e9], basis: physics, why: "a duration or delay: >= 0 and within the lifespan", source: "definition"}
  period: {dim: time, hard: [1.0, 5.2e9], basis: physics, why: "a cycle period: above 1 ms, within the lifespan", source: "definition"}
  # ---- rates -----------------------------------------------------------------------------------------------------
  rate_first: {dim: rate, hard: [0, 1.0e6], basis: physics, why: "a first-order rate: not faster than 1 per us (conformational change)", source: "[HB 6]"}
  rate_second: {dim: rate2, hard: [0, 1.0e4], basis: physics, why: "a bimolecular association: at most the diffusion limit ~1e10 /M/s (Smoluchowski)", source: "[HB 6]"}
  frequency_muscle: {dim: rate, hard: [0, 15], basis: physics, why: "a muscle pump or contraction cycle: at most 1 per pump duration (~80 ms)", source: "pump_duration_ms"}
  frequency_any: {dim: rate, hard: [0, 1000], basis: guessed_physical, why: "a sampling or event rate", source: "definition"}
  # ---- concentrations ----------------------------------------------------------------------------------------------
  binding_constant: {dim: conc, hard: [1.0e-9, 1.0e6], basis: physics,
    why: "a Kd, EC50, Km or half-activation: between 1 fM (tighter than streptavidin-biotin, 1e-14 M, the tightest non-covalent binding) and 1 M (no saturable binding above)",
    source: "[HB 8]; Green 1990 Methods Enzymol 184:51"}
  ca_free: {dim: conc, hard: [0, 1000], basis: guessed_physical,
    why: "free intracellular Ca: >= 0; peaks at channel mouths reach ~100 uM; a whole cell above 1 mM is dead",
    source: "[HB 9]"}
  ca_outside: {dim: conc, hard: [100, 20000], basis: guessed_physical, why: "extracellular Ca, the env window (0.1-20 mM)", source: "env.ions.Ca"}
  ion_inside: {dim: conc, hard: [0, 300000], basis: physics, why: "an inside ion: >= 0, below total osmolarity (~300 mOsm)", source: "[HB 9]"}
  ion_outside: {dim: conc, hard: [0, 600000], basis: guessed_physical, why: "an outside ion: >= 0, below the osmolarity of any body fluid or bath a worm survives (~600 mOsm)", source: "[HB 9]"}
  K_outside: {dim: conc, hard: [1000, 30000], basis: guessed_physical, why: "env K window outside", source: "env.ions.K"}
  Na_outside: {dim: conc, hard: [50000, 250000], basis: guessed_physical, why: "env Na window outside", source: "env.ions.Na"}
  Na_inside: {dim: conc, hard: [2000, 50000], basis: guessed_physical, why: "env Na window inside", source: "env.ions.Na"}
  Cl_outside: {dim: conc, hard: [20000, 250000], basis: guessed_physical, why: "env Cl window outside", source: "env.ions.Cl"}
  Mg: {dim: conc, hard: [0, 50000], basis: guessed_physical, why: "free Mg: >= 0, below 50 mM", source: "[HB 9]"}
  molecule_conc: {dim: conc, hard: [0, 10000], basis: guessed_physical,
    why: "one signalling species or protein in cytoplasm: >= 0, below 10 mM (total protein ~200-300 mg/ml)", source: "[HB 9]"}
  transmitter_peak: {dim: conc, hard: [0, 500000], basis: physics, why: "a cleft peak cannot exceed the vesicle's content concentration (~0.1-0.5 M)", source: "[HB 14]"}
  stimulus_conc: {dim: conc, hard: [0, 1.0e7], basis: physics, why: "a chemical in the environment: >= 0, below a neat liquid or saturated solution (~10 M)", source: "definition"}
  ph: {dim: none, hard: [3, 10], basis: guessed_physical, why: "pH of a living compartment (cytosol 6.8-7.6; the worm's intestinal lumen 4-6)", source: "[HB 13]"}
  gas_fraction: {dim: none, hard: [0, 100], basis: physics, why: "a gas percentage", source: "definition"}
  osmolarity: {dim: none, hard: [0, 2000], basis: guessed_physical, why: "mOsm/L of any body fluid or bath a worm survives", source: "[HB 9]"}
  optical_density: {dim: none, hard: [0, 200], basis: guessed_physical, why: "bacterial OD600: >= 0; a packed lawn ~100", source: "definition"}
  light: {dim: none, hard: [0, 100], basis: guessed_physical, why: "mW/mm2: sunlight ~1; optogenetic illumination up to tens", source: "definition"}
  # ---- dimensionless ----------------------------------------------------------------------------------------------
  fraction: {dim: none, hard: [0, 1], basis: physics, why: "a fraction or probability", source: "definition"}
  flag: {dim: none, hard: [0, 1], basis: physics, why: "a yes/no switch", source: "definition"}
  effect_mult: {dim: none, hard: [-1, 100], basis: physics, why: "a fractional change x -> x (1 + e): e >= -1 keeps the quantity >= 0; above 100-fold is a guessed edge", source: "definition"}
  gain_nonneg: {dim: none, hard: [0, 1000], basis: guessed_physical, why: "a non-negative multiplier or gain", source: "definition"}
  hill_receptor: {dim: none, hard: [0.3, 5], basis: physics, why: "Hill coefficient at most the number of agonist sites: 5 in a homopentamer (2 in most heteropentamers)", source: "[HB 8]"}
  hill_tetramer: {dim: none, hard: [0.3, 4], basis: physics, why: "Hill at most 4 sites (tetrameric glutamate receptor; calmodulin's 4 Ca sites in GCaMP)", source: "[HB 8]"}
  hill_any: {dim: none, hard: [0.1, 20], basis: guessed_physical, why: "an effective Hill coefficient of a lumped response (several cooperating units); 20 is above any measured", source: "[HB 8]"}
  q10: {dim: none, hard: [0.5, 70], basis: physics, why: "Q10 = exp(10 Ea / (R T^2)): Ea 0-300 kJ/mol gives 1-67; thermo-TRP channels reach ~20-30; below 1 needs a negative apparent activation energy (rare, allowed to 0.5)", source: "[HB 5]"}
  cv: {dim: none, hard: [0, 3], basis: guessed_physical, why: "a coefficient of variation of a quantal size", source: "definition"}
  ratio_ge1: {dim: none, hard: [1, 10000], basis: physics, why: "a ratio defined >= 1 (rectification)", source: "definition"}
  hill_bk: {dim: none, hard: [0, 8], basis: physics, why: "a Ca exponent of a BK/SLO tetramer: at most its 8 Ca sites (2 per subunit, RCK1 and the Ca bowl); 0 allowed (no Ca dependence of that step)", source: "[HB 8]; Xia, Zeng and Lingle 2002 Nature 418:880"}
  gate_factor: {dim: none, hard: [0, 100], basis: guessed_physical, why: "a factor of a product steady state (egl19 hinf = (a s1 + b)(c s2 + d)); each >= 0; the binding limit is the joint constraint gate_window (hinf in [0, 1])", source: "constraints.yaml gate_window"}
  sigmoid_weight: {dim: none, hard: [0, 1000], basis: guessed_physical, why: "a weight or divisor inside a published activation curve (Luo-Rudy pump, Du muscle gates): >= 0; the binding limit is that the curve stays in [0, 1] (gate_window)", source: "constraints.yaml gate_window"}
  speed: {dim: none, hard: [0, 10], basis: guessed_physical, why: "body lengths per second: the fastest crawling worms reach ~0.5 L/s", source: "WormAtlas"}
  strain: {dim: none, hard: [0, 2], basis: physics, why: "a muscle or body strain: a fibre cannot shorten past 100% and does not survive more than doubling", source: "definition"}
  curvature_strain: {dim: none, hard: [0, 1], basis: physics, why: "a body-wall strain from bending: at most body radius over the smallest bend radius (~1)", source: "definition"}
  modulus_kPa: {dim: none, hard: [0.01, 2.0e7], basis: physics, why: "an elastic modulus of any tissue: brain ~0.1-1 kPa to bone ~20 GPa", source: "[HB 10]"}
  modulus_Pa: {dim: none, hard: [10, 2.0e10], basis: physics, why: "as modulus_kPa, in Pa", source: "[HB 10]"}
  poisson: {dim: none, hard: [0, 0.5], basis: physics, why: "Poisson ratio of an isotropic stable material with positive volume: -1 to 0.5; tissues 0.3-0.5 (0 allowed)", source: "definition"}
  density_tissue: {dim: none, hard: [900, 2000], basis: physics, why: "kg/m3: fat 900 to bone 2000", source: "definition"}
  density_water: {dim: none, hard: [990, 1030], basis: physics, why: "kg/m3: water to sea water, 0-40 C", source: "CRC Handbook"}
  viscosity_mPa_s: {dim: none, hard: [0.6, 1.0e7], basis: physics, why: "water at 40 C (0.65 mPa s) to a stiff gel", source: "CRC Handbook"}
  drag_Pa_s: {dim: none, hard: [0, 1.0e5], basis: guessed_physical, why: "a resistive-force coefficient: >= 0; agar values are ~10-1000 Pa s", source: "[HB 10]"}
  gravity: {dim: none, hard: [9.78, 9.84], basis: physics, why: "g at Earth's surface", source: "definition"}
  surface_tension: {dim: none, hard: [0.02, 0.076], basis: physics, why: "N/m: water 0-40 C (0.070-0.076), down to ~0.02 with surfactant", source: "CRC Handbook"}
  mass_ug: {dim: none, hard: [0.01, 20], basis: physics, why: "a worm from L1 (~0.02 ug) to the largest adults (~10 ug)", source: "WormAtlas"}
  length_mm: {dim: none, hard: [0.2, 2], basis: physics, why: "a worm from L1 (0.25 mm) to the largest adults (~1.5 mm)", source: "WormAtlas"}
  permeability_um_s: {dim: none, hard: [0, 1000], basis: guessed_physical, why: "a membrane water permeability: >= 0; aquaporin-rich red cells ~ 50-200 um/s", source: "definition"}
  thermo_gradient: {dim: none, hard: [0, 20], basis: guessed_physical, why: "C/cm on a plate", source: "definition"}
  force_N: {dim: none, hard: [0, 10], basis: guessed_physical, why: "a tap on a plate, N", source: "definition"}
  angle_deg: {dim: none, hard: [-180, 180], basis: physics, why: "an angle", source: "definition"}
  # ---- energy, mechanics, space ----------------------------------------------------------------------------------
  atp_free_energy: {dim: none, hard: [28, 75], basis: physics, why: "-dG of ATP hydrolysis in a cell, kJ/mol: at least the standard 30.5 less a little, at most ~70 at extreme ATP/ADP", source: "[HB 11]"}
  oxycaloric: {dim: none, hard: [420, 490], basis: physics, why: "kJ per mol O2 burned: fat 437-451, protein ~440, carbohydrate ~473 (thermochemistry)", source: "Gnaiger 1983"}
  gas_constant: {dim: none, hard: [8.314462618, 8.314462618], basis: physics, why: "R is a constant", source: "CODATA 2018"}
  temperature_C: {dim: none, hard: [0, 40], basis: physics, why: "env temperature window", source: "env"}
  temperature_K: {dim: none, hard: [273.15, 313.15], basis: physics, why: "env temperature window", source: "env"}
  temperature_dC: {dim: none, hard: [0.01, 40], basis: physics, why: "a temperature difference inside the window", source: "env"}
  arrhenius_K: {dim: none, hard: [1000, 40000], basis: physics, why: "Arrhenius temperature Ea/R for Ea 8-330 kJ/mol", source: "[HB 5]"}
  energy_kT: {dim: none, hard: [0, 100], basis: guessed_physical, why: "a conformational free-energy difference of one protein (ATP hydrolysis ~20 kT)", source: "[HB 11]"}
  diffusion_ion: {dim: diffusion, hard: [0, 1150], basis: physics, why: "Ca2+: at most its free diffusion in water (7.9e-6 cm2/s at 25 C, x1.45 at 40 C by Stokes-Einstein: 1.15e-5)", source: "[HB 7]; CRC Handbook"}
  diffusion_small: {dim: diffusion, hard: [0, 3500], basis: physics, why: "a small molecule or peptide: at most free diffusion of the fastest small solute (O2, 2.1e-5 cm2/s at 25 C, ~3.5e-5 at 40 C) in water", source: "[HB 7]; CRC Handbook"}
  dispersion: {dim: diffusion, hard: [0, 100000], basis: guessed_physical, why: "effective mixing by body movement, not molecular diffusion", source: "definition"}
  length_body: {dim: length, hard: [0, 2000], basis: physics, why: "within an adult body length (~1-1.5 mm)", source: "WormAtlas"}
  length_radius: {dim: length, hard: [0.1, 50], basis: physics, why: "within the body radius (~40 um)", source: "WormAtlas"}
  length_nano: {dim: length, hard: [0.001, 1], basis: physics, why: "a channel-to-sensor distance: 1 nm to 1 um", source: "[HB 6]"}
  position: {dim: length, hard: [-2000, 2000], basis: physics, why: "a body coordinate", source: "definition"}
  body_fraction: {dim: none, hard: [0, 1], basis: physics, why: "a position as a fraction of body length", source: "definition"}
  area_cell: {dim: area, hard: [1, 1.0e6], basis: physics, why: "a cell or tissue membrane area within the body surface (~1.6e5 um2) and its folds", source: "WormAtlas"}
  area_cross: {dim: area, hard: [1, 10000], basis: physics, why: "within the body cross-section (pi 40^2 ~ 5000 um2)", source: "WormAtlas"}
  volume: {dim: volume, hard: [1, 1.0e7], basis: physics, why: "within the adult body volume (~3-6e6 um3)", source: "WormAtlas"}
  force: {dim: none, hard: [0, 1000], basis: guessed_physical, why: "uN on the worm: above ~1 mN it is crushed", source: "definition"}
  pressure: {dim: none, hard: [0, 1000], basis: guessed_physical, why: "kPa: nematode body pressures measure ~2-30 kPa (Ascaris)", source: "[HB 10]"}
  count_nonneg: {dim: none, hard: [0, 1.0e12], basis: physics, why: "a count is >= 0", source: "definition"}
  molecules_per_dcv: {dim: none, hard: [0, 3.0e5], basis: physics, why: "a 100 nm dense-core vesicle at 1 M holds 3e5 molecules", source: "[HB 14]"}
  molecules_per_neuron: {dim: none, hard: [0, 3.0e10], basis: physics, why: "a 50 um3 neuron at 1 M", source: "[HB 14]"}
  channels_per_cell: {dim: none, hard: [0, 2.0e7], basis: physics, why: "1e3 um2 at the densest packing", source: "[HB 1]"}
  eggs: {dim: none, hard: [0, 50], basis: guessed_physical, why: "the uterus holds about 10-20 eggs", source: "WormAtlas"}
  egg_rate: {dim: none, hard: [0, 60], basis: guessed_physical, why: "eggs per h or per min within a 300-egg brood over 3-4 days and burst rates", source: "WormAtlas"}
  model_units: {dim: none, model_units: true, basis: guessed_physical,
    why: "a number in a published model's own units with no physical anchor: >= 0 and at most 100x its biological range; to be re-expressed in physical units (listed for wmodel)", source: "none"}
  construction: {dim: none, model_units: true, basis: guessed_physical,
    why: "a constant of BAAIWorm's connection-building algorithm, not physiology: >= 0 and at most 100x its range", source: "none"}
  numerics: {dim: none, model_units: true, basis: guessed_physical, why: "a numerical step, not biology", source: "none"}
  structure: {dim: none, structure: true, basis: physics, why: "structure (morphology, wiring, anatomy): fixed from data, not fitted", source: "data"}

# family unitary conductances for conductance_density (pS, the largest measured for the family) [HB 2]
packing_per_um2: 20000        # densest measured: nicotinic AChR at the endplate crest ~1e4-2e4 per um2 [HB 1]
families:
  slo1: 300     # BK
  slo2: 200     # KNa (Slo2)
  ca:   30      # Cav1/Cav2/Cav3 (egl19, unc2, cca1)
  kv:   40      # Kv, KCNQ, EAG/ERG, Kir, SK (shk1, shl1, kvs1, egl36, egl2, kqt*, exp2, unc103, irk, kcnl)
  nca:  40      # NALCN
  leak: 300     # a mix (passive leak: any channel)
family_of:
  slo1: slo1
  slo2: slo2
  egl19: ca
  unc2: ca
  cca1: ca
  nca: nca
  default: kv

# rules, first match wins. re = regex on param_id (re.search); unit = optional list of row units
rules:
  # structure and construction
  # rule parameters proposed for wmodel (scripts/worm/ranges/rule_params.csv; not yet rows of the ledger)
  - {re: "^rule_syn_g_per_em_", hard_row_unit: [0, 90], basis: physics, why: "one EM section of an active zone (~1 um long x ~90 nm thick = 0.09 um2) packed at the densest measured receptor density (2e4 per um2, packing_per_um2) of 50 pS channels: 90 nS per section", source: "[HB 1], [HB 2]; RULE_PARAMS_LIT.md section 1"}
  - {re: "^rule_cm_specific$", cls: capacitance_specific}
  - {re: "^rule_pas_epas_", cls: reversal_leak}
  - {re: "^rule_dens_", cls: conductance_density}
  - {re: "^rule_cengen_threshold$", hard_row_unit: [1, 4], basis: physics, why: "CeNGEN publishes four expression thresholds", source: "Taylor et al. 2021 Cell"}
  - {re: "^(morph_|wire_)", cls: structure, role: fixed}
  - {re: "^build_length_per_seg$", cls: numerics, role: fixed}
  - {re: "^build_", cls: construction, role: fixed}
  - {re: "^cc_count$", cls: structure, role: fixed}
  - {re: "^int_posterior_rings$", hard_row_unit: [1, 9], basis: physics, why: "the intestine has 9 rings (int1-int9)", source: "WormAtlas", role: fixed}
  - {re: "^(syn_sign_receptor|syn_inhibitory|ent_dvb_excitatory|gap_innexin_pair|wire_nmj_baaiworm|wire_mn_baaiworm|ph_m3_inhibitory|ph_ser7_on_muscle)$", cls: flag, role: fixed}
  - {re: "^noise_hold_mV$|^met_vhold_mV$", cls: membrane_potential, role: fixed, why_role: "a recording condition"}
  - {re: "^met_step_s$", cls: numerics, role: fixed}
  - {re: "^obs_(volume_rate_hz)$", cls: frequency_any, role: fixed, why_role: "an instrument setting"}
  # body (Sibernetic / MuJoCo worm) and other catalog-only rows
